# Render blueprint for the CloudPulse API (free plan, no paid services — PRD §53).
# Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: cloudpulse-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Optional: set in the dashboard to enable LLM explanations. Without it
      # the template explanation is used.
      - key: ANTHROPIC_API_KEY
        sync: false
